<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>North American Tree Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: Arial, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #sidebar {
      position: absolute; top: 10px; right: 10px; background: white;
      border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      z-index: 1; width: 260px; max-height: calc(100vh - 20px);
      display: flex; flex-direction: column;
    }
    #sidebar-header { padding: 12px 14px 8px; border-bottom: 1px solid #eee; flex-shrink: 0; }
    #sidebar-header h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #555; margin-bottom: 8px; }
    #search-box { width: 100%; padding: 6px 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; outline: none; }
    #search-box:focus { border-color: #aaa; }
    #species-count { font-size: 11px; color: #999; margin-top: 5px; }
    #legend { overflow-y: auto; flex: 1; padding: 6px 0; }
    .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 14px; cursor: pointer; }
    .legend-item:hover { background: #f5f5f5; }
    .legend-item input[type="checkbox"] { cursor: pointer; width: 13px; height: 13px; flex-shrink: 0; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .legend-label { font-size: 12px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend-label.disabled { color: #bbb; text-decoration: line-through; }
    .legend-item.hidden-item { display: none; }
    .popup-content { font-family: Arial, sans-serif; font-size: 13px; color: #333; padding: 6px 8px; max-width: 220px; }
    .popup-content h4 { margin: 0 0 6px 0; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .popup-species { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
    .popup-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
    .popup-name { font-weight: bold; font-size: 13px; }
    .popup-latin { font-style: italic; font-size: 11px; color: #777; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="sidebar">

    <h3>Tree Species</h3>

  </div>
  <div id="legend"></div>
</div>

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [-96, 50],
  zoom: 3
});

const legend = document.getElementById('legend');
const countEl = document.getElementById('species-count');

function updateCount() {
  const visible = document.querySelectorAll('.legend-item:not(.hidden-item)').length;
  countEl.textContent = visible + ' of ' + species.length + ' species shown';
}

species.forEach(s => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.dataset.name = s.name.toLowerCase();
  item.dataset.latin = s.latin.toLowerCase();
  item.innerHTML = `
    <input type="checkbox" id="toggle-${s.id}" checked>
    <div class="legend-swatch" style="background:${s.color}"></div>
    <label class="legend-label" for="toggle-${s.id}" title="${s.name} (${s.latin})">${s.name}</label>
  `;
  legend.appendChild(item);

  item.querySelector('input').addEventListener('change', (e) => {
    if (map.getLayer(s.id)) {
      map.setLayoutProperty(s.id, 'visibility', e.target.checked ? 'visible' : 'none');
    }
    item.querySelector('.legend-label').classList.toggle('disabled', !e.target.checked);
  });
});

updateCount();

document.getElementById('search-box').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.legend-item').forEach(item => {
    const match = !query || item.dataset.name.includes(query) || item.dataset.latin.includes(query);
    item.classList.toggle('hidden-item', !match);
  });
  updateCount();
});

const popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });

map.on('load', () => {
  species.forEach(s => {
    map.addSource(s.id, { type: 'geojson', data: s.file });
    map.addLayer({
      id: s.id, type: 'fill', source: s.id,
      paint: { 'fill-color': s.color, 'fill-opacity': 0.5 }
    });
  });

  const layerIDs = species.map(s => s.id);

  map.on('mousemove', (e) => {
    const visibleLayers = layerIDs.filter(id => map.getLayoutProperty(id, 'visibility') !== 'none');
    const features = map.queryRenderedFeatures(e.point, { layers: visibleLayers });

    if (features.length === 0) {
      popup.remove();
      map.getCanvas().style.cursor = '';
      return;
    }

    const presentIDs = [...new Set(features.map(f => f.layer.id))];
    const presentSpecies = presentIDs.map(id => species.find(s => s.id === id)).filter(Boolean);

    const rows = presentSpecies.map(s => `
      <div class="popup-species">
        <div class="popup-swatch" style="background:${s.color}"></div>
        <div>
          <div class="popup-name">${s.name}</div>
          <div class="popup-latin">${s.latin}</div>
        </div>
      </div>`).join('');

    popup.setLngLat(e.lngLat)
      .setHTML(`<div class="popup-content"><h4>Species at this location</h4>${rows}</div>`)
      .addTo(map);
    map.getCanvas().style.cursor = 'pointer';
  });

  map.on('mouseleave', () => { popup.remove(); map.getCanvas().style.cursor = ''; });
});
</script>
