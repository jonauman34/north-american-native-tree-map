<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>North American Tree Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">

  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    /* Sidebar */
    #sidebar {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 16px;
      z-index: 1;
      min-width: 200px;
    }

    #sidebar h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      cursor: pointer;
    }

    .legend-item input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-label {
      font-size: 13px;
      color: #333;
      user-select: none;
    }

    .legend-label.disabled {
      color: #aaa;
      text-decoration: line-through;
    }

    /* Popup */
    .popup-content {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #333;
      padding: 6px 8px;
    }

    .popup-content h4 {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .popup-species {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
      font-weight: bold;
    }

    .popup-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Sidebar legend + toggles -->
<div id="sidebar">
  <h3>Tree Species</h3>
  <div id="legend"></div>
</div>

<script>
  mapboxgl.accessToken = 'pk.eyJ1Ijoiam9uYXVtYW4iLCJhIjoiY21zbDFpam9zMDRidjJ5cHZiazk2eHFtZSJ9.bML0bt0b6r2UXDdw7MxccA';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/light-v11',
    center: [-96, 50],
    zoom: 3
  });

  // Define all species in one place for easy management
  const species = [
    { id: 'Alaska cedar',   file: 'Alaska_cedar.geojson',   color: '#2d6a4f' },
    { id: 'American beech', file: 'American_beech.geojson', color: '#e63946' },
    { id: 'Winged elm',     file: 'Winged_elm.geojson',     color: '#f4a261' },
    { id: 'Yellow birch',   file: 'Yellow_birch.geojson',   color: '#457b9d' },
    { id: 'Tulip poplar',   file: 'Tulip_Poplar.geojson',   color: '#9b5de5' },
  ];

  // Build the legend dynamically
  const legend = document.getElementById('legend');
  species.forEach(s => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <input type="checkbox" id="toggle-${s.id}" checked>
      <div class="legend-swatch" style="background:${s.color}"></div>
      <label class="legend-label" for="toggle-${s.id}">${s.id}</label>
    `;
    legend.appendChild(item);

    // Toggle layer visibility on checkbox change
    item.querySelector('input').addEventListener('change', (e) => {
      const visibility = e.target.checked ? 'visible' : 'none';
      map.setLayoutProperty(s.id, 'visibility', visibility);

      // Strike through label when hidden
      item.querySelector('.legend-label').classList.toggle('disabled', !e.target.checked);
    });
  });

  // Single shared popup
  const popup = new mapboxgl.Popup({
    closeButton: false,
    closeOnClick: false
  });

  map.on('load', () => {

    species.forEach(s => {
      // Add source
      map.addSource(s.id, {
        type: 'geojson',
        data: s.file
      });

      // Add filled layer
      map.addLayer({
        id: s.id,
        type: 'fill',
        source: s.id,
        paint: {
          'fill-color': s.color,
          'fill-opacity': 0.5
        }
      });
    });

    // All layer IDs for querying
    const layerIDs = species.map(s => s.id);

    // On mouse move, check all visible layers at once
    map.on('mousemove', (e) => {
      const visibleLayers = layerIDs.filter(id =>
        map.getLayoutProperty(id, 'visibility') !== 'none'
      );

      const features = map.queryRenderedFeatures(e.point, { layers: visibleLayers });

      if (features.length === 0) {
        popup.remove();
        map.getCanvas().style.cursor = '';
        return;
      }

      const presentSpecies = [...new Set(features.map(f => f.layer.id))];

      const speciesRows = presentSpecies.map(id => {
        const s = species.find(sp => sp.id === id);
        return `
          <div class="popup-species">
            <div class="popup-swatch" style="background:${s.color}"></div>
            ${s.id}
          </div>`;
      }).join('');

      const html = `
        <div class="popup-content">
          <h4>Species at this location</h4>
          ${speciesRows}
        </div>`;

      popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
      map.getCanvas().style.cursor = 'pointer';
    });

    // Remove popup when mouse leaves the map
    map.on('mouseleave', () => {
      popup.remove();
      map.getCanvas().style.cursor = '';
    });

  });
</script>

</body>
</html>
